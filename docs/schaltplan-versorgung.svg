<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1590" viewBox="0 0 1800 1590">
<rect width="100%" height="100%" fill="white"/>
<style>text{font-family:Arial,DejaVu Sans,sans-serif;fill:#152331;font-size:24px} .title{font-size:37px;font-weight:bold}.head{font-size:27px;font-weight:bold}.small{font-size:22px}</style>
<text x="55" y="65" class="title">Blatt 1 · Versorgung und Motor</text>
<text x="55" y="105" class="small">04.10.2026 · Revision B · Entwurf, noch nicht aufgebaut/getestet</text>
<polyline points="55,140 1745,140" fill="none" stroke="#c3ced8" stroke-width="4"/>
<text x="55" y="182" class="head">A · Beide fertigen Netzteile in die vorhandene Schweizer Mehrfachsteckdose stecken</text>
<rect x="65" y="225" width="485" height="220" rx="8" fill="#f4f7fa" stroke="#354b60" stroke-width="2"/>
<text x="81" y="262" class="head">S0 · CH-Mehrfachsteckdose</text>
<text x="81" y="303" class="small">Typ-13-Buchsen · gemeinsamer Schalter</text>
<text x="81" y="339" class="small">Steckplatz 1 → W1 → PS1</text>
<text x="81" y="375" class="small">Steckplatz 2 → PS2</text>
<text x="81" y="411" class="small">Vorhanden; beide Netzteile gemeinsam aus</text>
<rect x="850" y="225" width="870" height="200" rx="8" fill="#f4f7fa" stroke="#354b60" stroke-width="2"/>
<text x="866" y="262" class="head">PS1 · Mean Well GST220A48-R7B</text>
<text x="866" y="303" class="small">W1: Typ-12-Stecker ↔ IEC-C13-Buchse, aus Bestand</text>
<text x="866" y="339" class="small">Netzteileingang: IEC-C14</text>
<text x="866" y="375" class="small">Ausgang: 48 V / 4,6 A · 4-poliger Power-DIN-R7B</text>
<polyline points="550,300 850,300" fill="none" stroke="#556779" stroke-width="4"/>
<text x="585" y="280" class="small">W1 · fertiges Netzkabel</text>
<rect x="65" y="520" width="670" height="155" rx="8" fill="#f4f7fa" stroke="#354b60" stroke-width="2"/>
<text x="81" y="557" class="head">PS2 · Goobay 44952 · USB-Netzteil</text>
<text x="81" y="598" class="small">Steckt direkt in Steckplatz 2 von S0</text>
<text x="81" y="634" class="small">USB-A-Ausgang: nominal 5 V</text>
<polyline points="290,445 290,520" fill="none" stroke="#556779" stroke-width="4"/>
<rect x="1170" y="520" width="550" height="155" rx="8" fill="#f4f7fa" stroke="#354b60" stroke-width="2"/>
<text x="1186" y="557" class="head">U1 · Arduino Uno R3</text>
<text x="1186" y="598" class="small">W2 in USB-B-Buchse stecken</text>
<text x="1186" y="634" class="small">5-V-Verteilung siehe Blatt 2</text>
<polyline points="735,600 1170,600" fill="none" stroke="#bd2734" stroke-width="4"/>
<text x="780" y="580" class="small">W2 · USB-A ↔ USB-B</text>
<polyline points="55,735 1745,735" fill="none" stroke="#c3ced8" stroke-width="4"/>
<text x="55" y="777" class="head">B · 48-V-Anschluss über W5; keine Arbeiten am Netzteilkabel oder an 230 V</text>
<rect x="65" y="825" width="750" height="230" rx="8" fill="#f4f7fa" stroke="#354b60" stroke-width="2"/>
<text x="81" y="862" class="head">W5 · GlobTek KPPX4124641M0KPJX4(R)</text>
<text x="81" y="903" class="small">Power-DIN-Buchse auf unveränderten PS1-Stecker</text>
<text x="81" y="939" class="small">Nur männliches Ende der Verlängerung abschneiden</text>
<text x="81" y="975" class="small">Vier AWG-18-Adern: 2 × +48 V, 2 × Rückleiter</text>
<text x="81" y="1011" class="small">Kontaktlage durchmessen; Schirm am Schnitt isolieren</text>
<polyline points="1720,350 1760,350 1760,800 440,800 440,825" fill="none" stroke="#bd2734" stroke-width="4"/>
<rect x="900" y="825" width="330" height="100" rx="8" fill="#f4f7fa" stroke="#354b60" stroke-width="2"/>
<text x="916" y="862" class="head">X1 · WAGO 221-413</text>
<text x="916" y="903" class="small">1 / 2: beide +48-V-Adern</text>
<rect x="900" y="985" width="330" height="100" rx="8" fill="#f4f7fa" stroke="#354b60" stroke-width="2"/>
<text x="916" y="1022" class="head">X2 · WAGO 221-413</text>
<text x="916" y="1063" class="small">1 / 2: beide Rückleiter</text>
<polyline points="815,900 900,900" fill="none" stroke="#bd2734" stroke-width="4"/>
<polyline points="815,1035 900,1035" fill="none" stroke="#556779" stroke-width="4"/>
<rect x="1360" y="825" width="360" height="300" rx="8" fill="#f4f7fa" stroke="#354b60" stroke-width="2"/>
<text x="1376" y="862" class="head">U3 · DM860T V3.0</text>
<text x="1376" y="903" class="small">AC (erste Klemme)</text>
<text x="1376" y="939" class="small">AC (zweite Klemme)</text>
<text x="1376" y="975" class="small">A+ / A− / B+ / B−</text>
<text x="1376" y="1011" class="small">Signale: Blatt 2</text>
<text x="1376" y="1047" class="small">ENA / ALM / BRK frei</text>
<polyline points="1230,900 1360,900" fill="none" stroke="#bd2734" stroke-width="4"/>
<text x="1240" y="880" class="small">X1.3</text>
<polyline points="1230,1035 1305,1035 1305,936 1360,936" fill="none" stroke="#556779" stroke-width="4"/>
<text x="1240" y="1015" class="small">X2.3</text>
<text x="890" y="1160" class="small">X1.3 / X2.3 → U3 AC/AC: je kurze 1,5-mm²-Kupferlitze</text>
<rect x="65" y="1190" width="750" height="230" rx="8" fill="#f4f7fa" stroke="#354b60" stroke-width="2"/>
<text x="81" y="1227" class="head">M1 · 34HS46-6004S1</text>
<text x="81" y="1268" class="small">Motorlieferkabel, 1 m; keine Verlängerung vorgesehen</text>
<text x="81" y="1304" class="small">Schwarz → A+       Grün → A−</text>
<text x="81" y="1340" class="small">Rot → B+               Blau → B−</text>
<text x="81" y="1376" class="small">Wicklungspaare vor Anschluss durchmessen</text>
<polyline points="1530,1125 1530,1230 815,1230" fill="none" stroke="#895821" stroke-width="4"/>
<text x="875" y="1210" class="small">Vier Motoradern → U3 A+/A−/B+/B−</text>
<rect x="900" y="1270" width="820" height="185" rx="8" fill="#f4f7fa" stroke="#354b60" stroke-width="2"/>
<text x="916" y="1307" class="head">Vor dem Einschalten</text>
<text x="916" y="1348" class="small">PS1 separat, trocken und belüftet aufstellen.</text>
<text x="916" y="1384" class="small">48-V-Rückleiter X2 nicht an Arduino-GND brücken.</text>
<text x="916" y="1420" class="small">W5-Steckerzuordnung messen; nie nach Farben raten.</text>
<text x="65" y="1495" class="small">Beide AC-Klemmen akzeptieren 48 V DC nur für die hier bezeichnete U3-Version.</text>
<text x="55" y="1555" class="small">Maßgebliche Pinliste und Aufbaufolge: docs/elektronik.md · Nur spannungslos verdrahten.</text>
</svg>
