<text x="55" y="65" class="title">Blatt 2 · Uno direkt, fertige Signalmodule und PIR</text>
<text x="55" y="105" class="small">04.10.2026 · Revision B · Entwurf, noch nicht aufgebaut/getestet</text>
<polyline points="55,140 1745,140" fill="none" stroke="#c3ced8" stroke-width="4"/>
<text x="55" y="182" class="head">A · 5 V und GND verteilen · zwei separate WAGO-Klemmen · kein Anschluss-Shield</text>
<rect x="65" y="230" width="485" height="230" rx="8" fill="#f4f7fa" stroke="#354b60" stroke-width="2"/>
<text x="81" y="267" class="head">U1 · Arduino Uno R3</text>
<text x="81" y="308" class="small">5V → X3.1</text>
<text x="81" y="344" class="small">Erster GND nach 5V → X4.1</text>
<text x="81" y="380" class="small">Zweiter GND nach 5V → J1.4</text>
<text x="81" y="416" class="small">Power-Leiste: VIN bleibt frei</text>
<rect x="700" y="230" width="460" height="270" rx="8" fill="#f4f7fa" stroke="#354b60" stroke-width="2"/>
<text x="716" y="267" class="head">X3 · WAGO 221-415 · +5 V</text>
<text x="716" y="308" class="small">1 ← Uno 5V</text>
<text x="716" y="344" class="small">2 → U4 V+ (rote E55-Buchse)</text>
<text x="716" y="380" class="small">3 → U5 V+ (rote E55-Buchse)</text>
<text x="716" y="416" class="small">4 → J1.5 (+5 V für PIR)</text>
<text x="716" y="452" class="small">5: frei</text>
<rect x="1250" y="230" width="490" height="270" rx="8" fill="#f4f7fa" stroke="#354b60" stroke-width="2"/>
<text x="1266" y="267" class="head">X4 · WAGO 221-415 · GND</text>
<text x="1266" y="308" class="small">1 ← Uno erster Power-GND</text>
<text x="1266" y="344" class="small">2 → U4 GND (schwarze E55-Buchse)</text>
<text x="1266" y="380" class="small">3 → U5 GND (schwarze E55-Buchse)</text>
<text x="1266" y="416" class="small">4 → J1.2 (GND für PIR)</text>
<text x="1266" y="452" class="small">5 ← W4-Schirm, nur Steuerungsende</text>
