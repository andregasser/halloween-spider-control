<polyline points="550,344 610,344 610,545 1210,545 1210,308 1250,308" fill="none" stroke="#556779" stroke-width="4"/>
<text x="65" y="590" class="small">E24: Header-Stecker am Uno / in E55-Buchse; an WAGO nur freie abisolierte Leiter.</text>
<text x="65" y="630" class="small">X3 und X4 getrennt halten. WAGO: 11 mm abisolieren; passende Leiter, kein Metallstift.</text>
<polyline points="55,665 1745,665" fill="none" stroke="#c3ced8" stroke-width="4"/>
